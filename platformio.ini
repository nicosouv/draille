[env:t-beam-supreme]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 460800
upload_before_reset = usb_reset

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
    lewisxhe/SensorLib @ ^0.1.4
    lewisxhe/XPowersLib @ ^0.2.0

; Build flags
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; TFT_eSPI config (bypasses User_Setup.h lookup)
    -DUSER_SETUP_LOADED
    -DGC9A01_DRIVER
    -DUSE_FSPI_PORT
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=3
    -DTFT_SCLK=6
    -DTFT_CS=45
    -DTFT_DC=46
    -DTFT_RST=48
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_FONT8
    -DLOAD_GFXFF
    -DSMOOTH_FONT
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=8000000

[env:wokwi-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = -<*> +<../test/wokwi/>
lib_deps =
    adafruit/Adafruit ILI9341 @ ^1.6.0
    adafruit/Adafruit GFX Library @ ^1.11.9

[env:native]
platform = native
build_flags =
    -DNATIVE_TEST
    -std=c++17
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
test_filter = native/*

[env:embedded-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    lewisxhe/SensorLib @ ^0.1.4
test_filter = embedded/*