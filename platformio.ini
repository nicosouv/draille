[env:t-beam-supreme]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus @ ^1.0.3
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0
    lewisxhe/SensorLib @ ^0.1.4

; Build flags
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DDEBUG

[env:native]
platform = native
build_flags =
    -DNATIVE_TEST
    -std=c++17
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
test_filter = native/*

[env:embedded-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    lewisxhe/SensorLib @ ^0.1.4
test_filter = embedded/*